name: Build Nocturne Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            docker-compose \
            wget \
            unzip \
            genimage \
            pigz

      - name: Enable QEMU multi-architecture support
        run: |
          # 使用完整路径调用 qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          # 验证 QEMU 注册情况
          docker run --rm --privileged multiarch/qemu-user-static:register --reset
          
      - name: Build kernel
        run: |
          cd resources/kernel
          ./build.sh

      - name: Build image
        run: |
          cd resources
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2  # 尝试使用 v4.6.2 版本
        with:
          name: nocturne-firmware
          path: /output
