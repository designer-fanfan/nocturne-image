name: Build Nocturne Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            docker-compose \
            wget \
            unzip \
            genimage \
            pigz \
            qemu-user-static \
            binfmt-support

      - name: Enable QEMU multi-architecture support
        run: |
          # 启用 QEMU 对多架构的支持
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Install just
        run: |
          # 安装 just 命令运行工具
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          just --version  # 验证安装

      - name: just run
        run: |
         just run
